name: MoMo Payment Gateway CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ngomse-hub/momo-payment-gateway
  K8S_NAMESPACE: momo-payment

jobs:
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Detect secrets in code
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        
      - name: Dependency check
        run: |
          echo "Checking for vulnerable dependencies..."
          pip install safety
          safety check -r requirements.txt
        
      - name: YAML lint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: k8s/
          config_file: .yamllint.yml

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-flask
          
      - name: Run unit tests
        env:
          MOMO_API_KEY: ${{ secrets.TEST_API_KEY }}
          MOMO_API_SECRET: ${{ secrets.TEST_API_SECRET }}
        run: |
          python -m pytest tests/ -v --tb=short

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Image vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-to-kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
          
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > ~/.kube/config
          kubectl config set-context --current --namespace=${{ env.K8S_NAMESPACE }}
          
      - name: Create namespace
        run: kubectl apply -f k8s/manifests/namespace.yaml
        
      - name: Create or update ConfigMap
        run: kubectl apply -f k8s/manifests/configmap.yaml
        
      - name: Create or update Secrets
        run: |
          # Create secrets from GitHub Secrets
          kubectl create secret generic momo-payment-secrets \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --from-literal=momo-api-key="${{ secrets.MOMO_API_KEY }}" \
            --from-literal=momo-api-secret="${{ secrets.MOMO_API_SECRET }}" \
            --from-literal=momo-merchant-id="${{ secrets.MOMO_MERCHANT_ID }}" \
            --dry-run=client -o yaml | kubectl apply -f -
            
      - name: Create RBAC
        run: kubectl apply -f k8s/manifests/rbac.yaml
        
      - name: Deploy application
        run: |
          # Update deployment with new image
          kubectl set image deployment/momo-payment-gateway \
            payment-gateway=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --namespace=${{ env.K8S_NAMESPACE }}
          kubectl apply -f k8s/manifests/deployment.yaml
          kubectl apply -f k8s/manifests/service.yaml
          
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/momo-payment-gateway \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --timeout=300s
          kubectl get pods --namespace=${{ env.K8S_NAMESPACE }}
          kubectl get svc --namespace=${{ env.K8S_NAMESPACE }}
          
      - name: Run smoke tests
        run: |
          POD_NAME=$(kubectl get pods --namespace=${{ env.K8S_NAMESPACE }} \
            -l app=momo-payment \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl exec $POD_NAME --namespace=${{ env.K8S_NAMESPACE }} \
            -- curl -s http://localhost:8080/health
